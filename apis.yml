name: RowGuard API Catalog
description: RowGuard validates UTF-8 CSV data against a caller-supplied column schema before it is imported
  into a database or automation workflow. In one HTTP request it reports missing values, type and format
  errors, out-of-range numbers, disallowed values, duplicate identifiers, and spreadsheet-formula (CSV
  injection) risks, returning record- and column-level references and optionally the rows that passed.
  It stores no files and calls no AI model, and is distributed through the RapidAPI marketplace.
